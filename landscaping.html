<head>

</head>
<body>

  <!-- Header: Note the updated links pointing back to index.html -->

      <nav class="nav">

        <div class="nav-links">

        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">

        <p style="text-align: center; margin-bottom: 50px; opacity: 0.8;">

        <!-- New Gallery Grid -->
        <div class="page-gallery-grid">
          <!-- Add your actual image URLs below -->
          <div class="page-gallery-item" style="background-image: url('landone.jpeg')"></div>
          <div class="page-gallery-item" style="background-image: url('landtwo.jpeg')"></div>
          <div class="page-gallery-item" style="background-image: url('landthree.jpeg')"></div>
          <div class="page-gallery-item" style="background-image: url('landfour.jpeg')"></div>
          <div class="page-gallery-item" style="background-image: url('landfive.jpeg')"></div>
          <div class="page-gallery-item" style="background-image: url('landsix.jpeg')"></div>
          <div class="page-gallery-item" style="background-image: url('landseven.jpeg')"></div>
          <div class="page-gallery-item" style="background-image: url('landeight.jpeg')"></div>
          <div class="page-gallery-item" style="background-image: url('landnine.jpeg')"></div>
          <div class="page-gallery-item" style="background-image: url('landten.jpeg')"></div>

 <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox">
    <span class="close-lightbox">&times;</span>
    <span class="nav-arrow prev-arrow">&#10094;</span> <!-- Left Arrow -->
    <img id="lightbox-img" class="lightbox-content" src="" alt="Enlarged gallery image">
    <span class="nav-arrow next-arrow">&#10095;</span> <!-- Right Arrow -->
  </div>
  <script>
    // --- NEW: Lightbox Logic with Navigation ---
    const galleryItems = document.querySelectorAll('.page-gallery-item');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.querySelector('.close-lightbox');
    const prevBtn = document.querySelector('.prev-arrow');
    const nextBtn = document.querySelector('.next-arrow');

    let currentIndex = 0; // Keeps track of which image is open

    // Helper function to extract the image URL
    function getImageUrl(item) {
      const bgImage = item.style.backgroundImage;
      return bgImage.slice(4, -1).replace(/["']/g, "");
    }

    // Helper function to change the image based on index
    function showImage(index) {
      // If we go past the end, loop back to the first image
      if (index >= galleryItems.length) {
        currentIndex = 0;
      } 
      // If we go past the beginning, loop to the last image
      else if (index < 0) {
        currentIndex = galleryItems.length - 1;
      } 
      else {
        currentIndex = index;
      }
      
      lightboxImg.src = getImageUrl(galleryItems[currentIndex]);
    }

    // Open lightbox on image click
    galleryItems.forEach((item, index) => {
      item.addEventListener('click', () => {
        currentIndex = index; // Save the clicked image's index
        showImage(currentIndex);
        lightbox.classList.add('active');
      });
    });

    // Close lightbox when clicking the 'X'
    closeBtn.addEventListener('click', () => {
      lightbox.classList.remove('active');
    });

    // Close lightbox when clicking the dark background
    lightbox.addEventListener('click', (e) => {
      // Make sure we aren't clicking the image or the navigation arrows
      if (e.target !== lightboxImg && e.target !== prevBtn && e.target !== nextBtn) {
        lightbox.classList.remove('active');
      }
    });

    // Mouse Navigation: Next and Previous Buttons
    prevBtn.addEventListener('click', () => {
      showImage(currentIndex - 1);
    });

    nextBtn.addEventListener('click', () => {
      showImage(currentIndex + 1);
    });

    // Keyboard Navigation: Arrow Keys and Escape Key
    document.addEventListener('keydown', (e) => {
      // Only trigger if the lightbox is actually open
      if (!lightbox.classList.contains('active')) return;

      if (e.key === 'ArrowLeft') {
        showImage(currentIndex - 1);
      } else if (e.key === 'ArrowRight') {
        showImage(currentIndex + 1);
      } else if (e.key === 'Escape') {
        lightbox.classList.remove('active');
      }
    });
  </script>
  
</body>
</html>
